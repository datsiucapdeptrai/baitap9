<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Đăng ký - Product Management</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        body {
            min-height: 100vh;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 0;
        }

        .register-card {
            width: 100%;
            max-width: 520px;
            border: 0;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card register-card mx-auto">
        <div class="card-body p-4 p-md-5">

            <div class="text-center mb-4">
                <h2 class="fw-bold">
                    Đăng ký tài khoản
                </h2>

                <p class="text-secondary mb-0">
                    Tạo tài khoản người dùng mới
                </p>
            </div>

            <form method="post"
                  th:action="@{/register}"
                  th:object="${registerRequest}">

                <div class="alert alert-danger"
                     th:if="${#fields.hasGlobalErrors()}">

                    <div th:each="error : ${#fields.globalErrors()}"
                         th:text="${error.defaultMessage}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="username"
                           class="form-label">
                        Username
                    </label>

                    <input type="text"
                           id="username"
                           class="form-control"
                           th:field="*{username}"
                           th:classappend=
                               "${#fields.hasErrors('username')}
                               ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{username}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email"
                           class="form-label">
                        Email
                    </label>

                    <input type="email"
                           id="email"
                           class="form-control"
                           th:field="*{email}"
                           th:classappend=
                               "${#fields.hasErrors('email')}
                               ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{email}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="fullName"
                           class="form-label">
                        Họ và tên
                    </label>

                    <input type="text"
                           id="fullName"
                           class="form-control"
                           th:field="*{fullName}"
                           th:classappend=
                               "${#fields.hasErrors('fullName')}
                               ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{fullName}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="password"
                           class="form-label">
                        Mật khẩu
                    </label>

                    <input type="password"
                           id="password"
                           class="form-control"
                           th:field="*{password}"
                           th:classappend=
                               "${#fields.hasErrors('password')}
                               ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{password}">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirmPassword"
                           class="form-label">
                        Nhập lại mật khẩu
                    </label>

                    <input type="password"
                           id="confirmPassword"
                           class="form-control"
                           th:field="*{confirmPassword}"
                           th:classappend=
                               "${#fields.hasErrors('confirmPassword')}
                               ? 'is-invalid'">

                    <div class="invalid-feedback"
                         th:errors="*{confirmPassword}">
                    </div>
                </div>

                <button type="submit"
                        class="btn btn-primary w-100">
                    Đăng ký
                </button>

                <div class="text-center mt-3">
                    Đã có tài khoản?

                    <a th:href="@{/login}">
                        Đăng nhập
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

</body>
</html>
