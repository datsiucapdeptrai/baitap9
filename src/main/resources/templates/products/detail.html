<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout}">

<head>
    <meta charset="UTF-8">
    <title th:text="${product.name}">
        Chi tiết sản phẩm
    </title>
</head>

<body>

<section layout:fragment="content">

    <div class="alert alert-success"
         th:if="${success}"
         th:text="${success}">
    </div>

    <div class="row">

        <div class="col-md-7">

            <h4>Hình ảnh sản phẩm</h4>

            <div class="row g-3"
                 th:if="${product.images != null
                    and !product.images.isEmpty()}">

                <div class="col-md-6"
                     th:each="image : ${product.images}">

                    <div class="card h-100">

                        <img class="card-img-top"
                             th:src="@{'/uploads/products/'
                                + ${image.imageUrl}}"
                             th:alt="${product.name}"
                             style="
                                height: 320px;
                                object-fit: cover;
                             ">

                        <div class="card-body text-center"
                             th:if="${image.primary}">

                            <span class="badge bg-success">
                                Ảnh chính
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="alert alert-warning"
                 th:if="${product.images == null
                    or product.images.isEmpty()}">
                Sản phẩm chưa có hình ảnh.
            </div>
        </div>

        <div class="col-md-5">

            <div class="card shadow-sm">
                <div class="card-body">

                    <h2 th:text="${product.name}">
                    </h2>

                    <h4 class="text-danger">
                        <span th:text="${#numbers.formatDecimal(
                            product.price,
                            0,
                            'COMMA',
                            2,
                            'POINT'
                        )}">
                        </span>
                    </h4>

                    <p>
                        <strong>Số lượng:</strong>

                        <span th:text="${product.quantity}">
                        </span>
                    </p>

                    <p>
                        <strong>Mô tả:</strong>
                    </p>

                    <p th:text="${product.description}">
                    </p>

                    <a class="btn btn-warning"
                       th:href="@{/products/edit/{id}
                            (id=${product.id})}">
                        Chỉnh sửa
                    </a>

                    <a class="btn btn-secondary"
                       th:href="@{/products}">
                        Quay lại
                    </a>

                </div>
            </div>
        </div>

    </div>

</section>

</body>
</html>
